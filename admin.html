<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BusterDrone — Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 20px 60px;
    background: #0a0d12;
    color: #dfe6ee;
    font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 15px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #7bdcb5;
    margin: 0 0 4px;
  }
  .sub { color: #5b6672; font-size: 12px; margin-bottom: 22px; }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #131922;
    border: 1px solid #232b36;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 22px;
    font-size: 13px;
  }
  .toggle-row input { transform: scale(1.3); accent-color: #7bdcb5; }
  .card {
    background: #131922;
    border: 1px solid #232b36;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .q { font-size: 13.5px; line-height: 1.5; color: #dfe6ee; margin-bottom: 10px; }
  .q::before { content: "Q: "; color: #7bdcb5; }
  textarea {
    width: 100%;
    min-height: 64px;
    background: #0a0d12;
    color: #dfe6ee;
    border: 1px solid #2a3340;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #7bdcb5; }
  button {
    margin-top: 8px;
    background: #1c2733;
    color: #7bdcb5;
    border: 1px solid #2a3340;
    border-radius: 6px;
    padding: 7px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12.5px;
  }
  button:hover { background: #232f3d; }
  button:disabled { opacity: .5; cursor: default; }
  .empty { color: #5b6672; font-size: 13px; padding: 8px 2px; }
</style>
</head>
<body>
  <h1>BusterDrone — Admin</h1>
  <div class="sub">Answers you send here show up in BusterDrone's speech bubble, exactly like an AI reply.</div>

  <div class="toggle-row">
    <input type="checkbox" id="admin-toggle">
    <label for="admin-toggle">Hold new questions for me instead of sending them to the AI</label>
  </div>

  <div id="list"><div class="empty">No pending questions.</div></div>

<script>
const listEl = document.getElementById('list');
const toggle = document.getElementById('admin-toggle');
let editing = new Set(); // ids currently being typed into — don't blow away the textarea on refresh

toggle.addEventListener('change', async () => {
  await fetch('/api/admin/mode', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled: toggle.checked })
  });
});

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function refresh() {
  let data;
  try {
    const res = await fetch('/api/admin/pending');
    data = await res.json();
  } catch (e) {
    return; // transient error — try again on the next tick
  }

  toggle.checked = !!data.admin_mode;

  if (!data.pending.length) {
    listEl.innerHTML = '<div class="empty">No pending questions.</div>';
    editing.clear();
    return;
  }

  // Don't touch cards the admin is currently typing an answer into.
  const currentIds = new Set(data.pending.map(p => p.id));
  for (const id of [...editing]) if (!currentIds.has(id)) editing.delete(id);

  for (const item of data.pending) {
    if (editing.has(item.id)) continue;
    if (document.getElementById('card-' + item.id)) continue;

    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + item.id;
    card.innerHTML = `
      <div class="q">${escapeHtml(item.question)}</div>
      <textarea placeholder="Type the reply BusterDrone will say…"></textarea>
      <br><button>Send reply</button>
    `;
    const textarea = card.querySelector('textarea');
    const btn = card.querySelector('button');
    textarea.addEventListener('focus', () => editing.add(item.id));
    textarea.addEventListener('input', () => editing.add(item.id));

    btn.addEventListener('click', async () => {
      const answer = textarea.value.trim();
      if (!answer) return;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        await fetch('/api/admin/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: item.id, answer })
        });
      } finally {
        editing.delete(item.id);
        card.remove();
      }
    });

    listEl.appendChild(card);
  }

  // Remove cards for questions that are no longer pending (answered elsewhere).
  for (const child of [...listEl.children]) {
    const id = child.id?.replace('card-', '');
    if (id && !currentIds.has(id)) child.remove();
  }
  if (!listEl.children.length) {
    listEl.innerHTML = '<div class="empty">No pending questions.</div>';
  }
}

(async function init() {
  try {
    const res = await fetch('/api/admin/mode');
    const data = await res.json();
    toggle.checked = !!data.enabled;
  } catch (e) {}
  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
